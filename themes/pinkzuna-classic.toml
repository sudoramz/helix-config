# Diagnostics
"error" = "#FF1A53"
"warning" = "#F69400"
"info" = "#00A1A1"
"hint" = "#905572"
"diagnostic.error" = { underline = { color = "#FF1A53", style = "curl" } }
"diagnostic.warning" = { underline = { color = "#F69400", style = "curl" } }
"diagnostic.info" = { underline = { color = "#00A1A1", style = "curl" } }
"diagnostic.hint" = { underline = { color = "#905572", style = "curl" } }

# Version control
"diff.plus" = "#00A1A1"
"diff.delta" = "#D62ABE"
"diff.delta.moved" = "#D62ABE"
"diff.minus" = "#FF1A53"

# Syntax
"attribute" = "#D58500"
"boolean" = { fg = "#D58500", modifiers = ["bold"] }
"comment" = { fg = "#AE85A1", modifiers = ["italic"] }

"punctuation.bracket" = "#9E9EB6"
"punctuation.delimiter" = "#9E9EB6"
"punctuation.special" = "#FBD2DC"
"string" = "#FF5B6F"
"string.escape" = "#FBD2DC"
"string.special" = "#FBD2DC"
"string.special.url" = { fg = "#FF88AC", modifiers = ["underlined"] }

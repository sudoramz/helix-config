# Diagnostics
"error" = "#FF5D7B"
"warning" = "#FFAC62"
"info" = "#00B9B9"
"hint" = "#9E9EB6"
"diagnostic.error" = { underline = { color = "#FF5D7B", style = "curl" } }
"diagnostic.warning" = { underline = { color = "#FFAC62", style = "curl" } }
"diagnostic.info" = { underline = { color = "#00B9B9", style = "curl" } }
"diagnostic.hint" = { underline = { color = "#9E9EB6", style = "curl" } }

# Version control
"diff.plus" = "#00B9B9"
"diff.delta" = "#FAC7E4"
"diff.delta.moved" = "#FAC7E4"
"diff.minus" = "#FF5D7B"

# Syntax
"attribute" = "#D8AC69"
"boolean" = { fg = "#D8AC69", modifiers = ["bold"] }

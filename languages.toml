# LANGUAGE SERVERS
[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]

[language-server.emmet-ls]
args = ["--stdio"]
command="emmet-language-server"

[language-server.eslint-ls]
args = ["--stdio"]
command = "vscode-eslint-language-server"

[language-server.eslint-ls.config]
validate = "on"
experimental = { useFlatConfig = false }
rulesCustomizations = []
run = "onType"
problems = { shortenToSingleLine = false }
nodePath = ""

[language-server.eslint-ls.config.codeAction.disableRuleComment]
enable = true
location = "separateLine"

[language-server.eslint-ls.config.codeAction.showDocumentation]
enable = true

[language-server.eslint-ls.config.codeActionOnSave]
enable = true
mode = "fixAll"

[language-server.eslint-ls.config.workingDirectory]
mode = "location"
[language-server.rust-analyzer]
command = "rust-analyzer"

[language-server.rust-analyzer.config]
inlayHints.bindingModeHints.enable = false
inlayHints.closingBraceHints.minLines = 10
inlayHints.closureReturnTypeHints.enable = "with_block"
inlayHints.discriminantHints.enable = "fieldless"
inlayHints.lifetimeElisionHints.enable = "skip_trivial"
inlayHints.typeHints.hideClosureInitialization = false

[language-server.rust-analyzer.config.files]
watcher = "server"


# LANGUAGE
[[language]]
name = "svelte"
auto-format = true
language-servers = [{ name = "tailwindcss-ls" }, "svelteserver", "eslint-ls"]
# formatter = { command = 'prettier', args = ["--plugin", "prettier-plugin-svelte", "--stdin"] }
block-comment-tokens = {start = "<!--", end = "-->"}

[[language]]
name = "go"
language-servers = [{ name = "gopls" }]

[[language]]
name = "esdl"
scope = "source.esdl"
injection-regex = "esdl"
file-types = ["esdl"]
comment-token = "#"
indent = { tab-width = 2, unit = "  " }
roots = ["edgedb.toml"]

[[language]]
name = "typescript"
auto-format = true
language-servers = [{ name = "tailwindcss-ls", except-features = ["hover"] }, "typescript-language-server", "emmet-ls", "eslint-ls"]
# formatter = { command = "prettier" }

[[language]]
name = "javascript"
auto-format = true
language-servers = [{ name = "tailwindcss-ls", except-features = ["hover"] }, "typescript-language-server", "emmet-ls", "eslint-ls"]
formatter = { command = "prettier" }

[[language]]
name = "jsx"
auto-format = true
language-servers = [ { name = "tailwindcss-ls", except-features = ["hover"]}, "typescript-language-server", "emmet-ls", "eslint-ls"]
formatter = { command = "prettier" }

[[language]]
name = "tsx"
auto-format = true
language-servers = [ { name = "tailwindcss-ls", except-features = ["hover"]}, "typescript-language-server" , "emmet-ls", "eslint-ls"]
# formatter = { command = "prettier" }

[[language]]
name = "html"
auto-format = true
language-servers = [ "tailwindcss-ls", "vscode-html-language-server" , "emmet-ls", "eslint-ls"]
formatter = { command = "prettier" }

[[language]]
name = "css"
auto-format = true
language-servers = [ { name="tailwindcss-ls", except-features = ["hover"] }, "vscode-css-language-server" , "emmet-ls" , "eslint-ls"]
formatter = { command = "prettier" }

[[language]]
name = "scss"
auto-format= true
language-servers = [ { name="tailwindcss-ls", except-features = ["hover"] }, "vscode-css-language-server" , "emmet-ls" , "eslint-ls"]
formatter = { command = "prettier" }

[[language]]
name = "rust"
scope = "source.rust"
injection-regex = "rs|rust"
file-types = ["rs"]
roots = ["Cargo.toml", "Cargo.lock"]
shebangs = ["rust-script", "cargo"]
auto-format = true
comment-tokens = ["//", "///", "//!"]
block-comment-tokens = [
  { start = "/*", end = "*/" },
  { start = "/**", end = "*/" },
  { start = "/*!", end = "*/" },
]
language-servers = [ "rust-analyzer" ]
indent = { tab-width = 4, unit = "    " }
persistent-diagnostic-sources = ["rustc", "clippy"]

[[language]]
name = "markdown"
formatter = { command = "dprint", args = ["fmt", "--stdin", "md"]}

# Grammar 
[[grammar]]
name ="esdl"
source = { git = "https://github.com/greym0uth/tree-sitter-esdl", rev = "df83acc8cacd0cfb139eecee0e718dc32c4f92e2" }
